name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS are not optional here: discovery walks the
        # filesystem and compares paths, and case-insensitive filesystems hide
        # a whole class of bug until the tool runs on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The suite runs the TypeScript sources directly, which needs the type
        # stripping that became the default in Node 22.18. The published package
        # is compiled and supports Node 20.10 -- that is verified by the
        # `supported-runtime` job below rather than assumed here.
        node: ['22.18', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the built CLI runs
        run: node dist/cli.js --version

  supported-runtime:
    name: oldest supported runtime (node 20.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build on a modern Node, then run the output on the oldest version the
      # `engines` field claims to support. This is the only thing that keeps
      # that claim honest.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: '20.10'

      - name: Run the built CLI on the oldest supported Node
        run: |
          node --version
          node dist/cli.js --version
          node dist/cli.js scan examples/collision-demo --json > /dev/null || true
  selfcheck:
    name: self-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The example collection contains a deliberate collision, so scan is
      # expected to report findings. What is being verified is that the tool
      # runs end to end and produces the documented output.
      - name: Scan the example collection
        run: node src/cli.ts scan examples/collision-demo --json > report.json || true

      - name: Verify the report is well-formed
        run: |
          node -e "
            const r = require('./report.json');
            if (r.schemaVersion !== 1) throw new Error('unexpected schema version');
            if (r.summary.skills !== 6) throw new Error('expected 6 demo skills, got ' + r.summary.skills);
            if (r.summary.collisions < 1) throw new Error('the demo collision has disappeared');
            console.log('report ok:', r.summary.skills, 'skills,', r.summary.collisions, 'collisions');
          "

      - name: Verify SARIF output is valid
        run: |
          node src/cli.ts scan examples/collision-demo --sarif > results.sarif || true
          node -e "
            const s = require('./results.sarif');
            if (s.version !== '2.1.0') throw new Error('unexpected SARIF version');
            if (!s.runs[0].tool.driver.rules.length) throw new Error('no rule descriptors');
            console.log('sarif ok:', s.runs[0].results.length, 'results');
          "

  publint:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Catches the classic publish mistakes — a bin that is not executable,
      # exports that point at files the tarball does not contain.
      - name: Check the published package shape
        run: |
          npm pack --dry-run
          node -e "
            const fs = require('fs');
            for (const f of ['dist/cli.js', 'dist/index.js', 'dist/index.d.ts']) {
              if (!fs.existsSync(f)) throw new Error('missing from build: ' + f);
            }
            console.log('package shape ok');
          "
